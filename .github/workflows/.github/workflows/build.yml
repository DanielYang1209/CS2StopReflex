name: Build CS2 Tool EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt5 pynput matplotlib

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --icon=CS2.ico --add-data "background.png;." --add-data "CS2.ico;." main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CS2_Stop_Reflex_Tool
        path: dist/main.exe
